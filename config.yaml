model:
  checkpoint: wm.pt

plan:
  horizon: 8          # how many 200ms ticks ahead the world model imagines
  candidates: 32      # futures sampled from the imitation prior per replan
  replan: 4           # ticks executed before looking again
  weights:            # defaults only, since Claude sets these per goal
    alive: 3.0
    value: 1.0
    novelty: 0.3
    prior: 0.1

brain:
  label_every: 25     # ticks between Claude progress scores, which are the value head's only labels
  idle_seconds: 3.0

hf:                   # imitation pretraining, pointed at the nearest 3D-navigation dataset you can find
  dataset: null
  split: train
  frame_column: image
  action_column: action
  action_map: {}      # e.g. {"forward": "w", "jump": "jump", "turn_left": "look_left"}
